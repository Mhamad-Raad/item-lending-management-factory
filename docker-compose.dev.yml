# Local development: only PostgreSQL runs in Docker. API and web run on the host (`pnpm dev`).
# Roles/databases are created by deploy/postgres/init on the first start of an empty volume.
# Reset everything: `docker compose -f docker-compose.dev.yml down -v`.
name: pallet-dev

services:
  postgres:
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      DB_OWNER_PASSWORD: pallet_owner_dev
      DB_APP_PASSWORD: pallet_app_dev
      # Also create the `pallet_test` database used by the integration suite.
      PALLET_CREATE_TEST_DB: 'true'
    ports:
      # 5434 on the host: 5432 and 5433 are commonly taken by other local PostgreSQL servers (Q33).
      - '127.0.0.1:5434:5432'
    volumes:
      - pgdata_dev:/var/lib/postgresql
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d pallet']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata_dev:
    name: pallet_dev_pgdata
