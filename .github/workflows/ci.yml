name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      skip_docker:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '24.21.0'

jobs:
  quality:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: pnpm audit --audit-level=high

  integration-e2e:
    name: Integration + Playwright e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://pallet_app:pallet_app_ci@localhost:5432/pallet?schema=public
      DATABASE_MIGRATE_URL: postgresql://pallet_owner:pallet_owner_ci@localhost:5432/pallet?schema=public
      DATABASE_TEST_URL: postgresql://pallet_app:pallet_app_ci@localhost:5432/pallet_test?schema=public
      DATABASE_TEST_MIGRATE_URL: postgresql://pallet_owner:pallet_owner_ci@localhost:5432/pallet_test?schema=public
      JWT_ACCESS_SECRET: ci-only-secret-ci-only-secret-ci-only-secret-ci-only-secret-0000000
      COOKIE_SECURE: 'false'
      TRUST_PROXY_SUBNET: loopback
      UPLOADS_DIR: ${{ github.workspace }}/.data/uploads
      ADMIN_USERNAME: admin
      ADMIN_DISPLAY_NAME: Administrator
      ADMIN_PASSWORD: ci-admin-password-123
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create roles and databases (same script as production first run)
        run: |
          docker cp deploy/postgres/init/01-roles.sh ${{ job.services.postgres.id }}:/tmp/01-roles.sh
          docker exec \
            -e POSTGRES_USER=postgres -e POSTGRES_DB=postgres \
            -e DB_OWNER_PASSWORD=pallet_owner_ci -e DB_APP_PASSWORD=pallet_app_ci \
            -e PALLET_CREATE_TEST_DB=true \
            ${{ job.services.postgres.id }} bash /tmp/01-roles.sh
      - run: pnpm build
      # Non-interactive: prisma migrate deploy + grants.sql (never `migrate dev` in CI).
      - run: pnpm db:deploy
      - run: pnpm test:integration
      - run: pnpm --filter @pallet/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      # E1–E8 against the built API and web app on pallet_test, reset and demo-seeded first (§14.6, Q63).
      - run: pnpm test:e2e:live
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/playwright-report-live
          retention-days: 14
      # The E6 baselines as this runner renders them: download and commit any the repository does not have yet.
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e6-screenshots
          path: apps/web/e2e-live/__screenshots__
          if-no-files-found: ignore
          retention-days: 14

  docker:
    name: Build images (no push)
    if: ${{ !inputs.skip_docker }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/caddy/Dockerfile
          push: false
          cache-from: type=gha,scope=caddy
          cache-to: type=gha,scope=caddy,mode=max
