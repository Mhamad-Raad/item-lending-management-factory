name: Deploy

# Deploys on a version tag (git tag v1.2.3 && git push --tags) or by hand from the Actions tab.
# By hand only from main or a tag: every job below refuses any other ref, so a branch nobody reviewed
# can never reach production (Q76). Also protect the `production` environment in the repository settings.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/ci.yml
    with:
      skip_docker: true
      # A new advisory warns here instead of blocking an unrelated fix (ARCHITECTURE.md Q133).
      audit_advisory: true

  images:
    needs: ci
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ghcr.io/mhamad-raad/pallet-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/caddy/Dockerfile
          push: true
          tags: ghcr.io/mhamad-raad/pallet-caddy:${{ github.sha }}
          cache-from: type=gha,scope=caddy
          cache-to: type=gha,scope=caddy,mode=max

  deploy:
    needs: images
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      # The runner's own OpenSSH, not a third-party action: nothing outside GitHub and this file sees the key.
      # The host key is pinned by the VPS_KNOWN_HOSTS secret (StrictHostKeyChecking=yes, no keyscan), so a
      # machine answering at VPS_HOST without the server's key is refused before the key is offered. On the VPS
      # the key is restricted to deploy.sh (docs/runbooks/deploy.md, "The deploy key"; Q128).
      - name: Deploy over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for name in VPS_HOST VPS_USER VPS_SSH_KEY VPS_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is missing from the production environment (docs/runbooks/deploy.md)."
              exit 1
            fi
          done
          umask 077
          ssh_dir="$RUNNER_TEMP/deploy-ssh"
          mkdir -p "$ssh_dir"
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          printf '%s\n' "$VPS_SSH_KEY" > "$ssh_dir/key"
          ssh -i "$ssh_dir/key" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=30 \
            "$VPS_USER@$VPS_HOST" "/opt/pallet/deploy/deploy.sh $DEPLOY_SHA"
